<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galaxy Game Launcher</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: url('https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    font-size: 42px;
    margin-bottom: 10px;
    text-shadow: 0 0 20px #7df;
  }

  #search {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    margin-bottom: 20px;
    background: rgba(0,0,0,0.5);
    color: #fff;
  }

  .game-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .game-item {
    background: rgba(0,0,0,0.55);
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    transition: transform 0.2s, box-shadow 0.3s;
    backdrop-filter: blur(4px);
  }

  .game-item:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #6af;
  }

  .game-item img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 10px;
    box-shadow: 0 0 10px #4af;
  }

  .game-item a {
    color: #9df;
    text-decoration: none;
    font-size: 18px;
    text-shadow: 0 0 10px #4af;
  }

  .game-item a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<h1>Galaxy Game Launcher</h1>
<input id="search" type="text" placeholder="Search games...">

<div class="game-list" id="gameList"></div>

<script>
const placeholderImg =
  "https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=800&q=80";

function extractImageFromHTML(url) {
  return fetch(url)
    .then(r => r.text())
    .then(html => {
      const match = html.match(/<img[^>]+src=["']([^"']+)["']/i);
      return match ? match[1] : placeholderImg;
    })
    .catch(() => placeholderImg);
}

fetch("https://api.github.com/repos/Lego611091/html/contents")
  .then(res => res.json())
  .then(async files => {
    const list = document.getElementById("gameList");

    const htmlFiles = files.filter(f => f.name.endsWith(".html"));

    for (const file of htmlFiles) {
      const item = document.createElement("div");
      item.className = "game-item";

      const img = document.createElement("img");
      img.src = await extractImageFromHTML(file.name);

      const link = document.createElement("a");
      link.href = file.name;
      link.textContent = file.name;

      item.appendChild(img);
      item.appendChild(link);
      list.appendChild(item);
    }

    document.getElementById("search").addEventListener("input", function() {
      const term = this.value.toLowerCase();
      document.querySelectorAll(".game-item").forEach(item => {
        const name = item.textContent.toLowerCase();
        item.style.display = name.includes(term) ? "" : "none";
      });
    });
  });
</script>

</body>
</html>
