<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galaxy Game Launcher</title>

<style>
  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #071b52 0, #02030a 40%, #000000 100%);
    color: #e6f7ff;
    margin: 0;
    padding: 20px;
    overflow-x: hidden;
  }

  /* Animated stars */
  .stars, .stars2, .stars3 {
    position: fixed;
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background-repeat: repeat;
    pointer-events: none;
    z-index: -1;
  }
  .stars { animation: drift 80s linear infinite; }
  .stars2 { opacity: 0.7; animation: drift 120s linear infinite; }
  .stars3 { opacity: 0.4; animation: drift 160s linear infinite; }

  @keyframes drift {
    from { transform: translate3d(0,0,0); }
    to   { transform: translate3d(-25%, -25%, 0); }
  }

  h1 {
    text-align: center;
    font-size: 42px;
    margin-bottom: 10px;
    text-shadow: 0 0 25px #3cf, 0 0 40px #0ff;
    letter-spacing: 2px;
  }

  #search {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    border-radius: 999px;
    border: 1px solid #3cf;
    background: rgba(3, 10, 30, 0.8);
    color: #e6f7ff;
    margin-bottom: 20px;
    box-shadow: 0 0 12px #3cf88;
  }

  .game-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .game-item {
    background: rgba(5, 20, 50, 0.9);
    border-radius: 14px;
    padding: 10px;
    text-align: center;
    border: 1px solid #3cf;
    box-shadow: 0 0 18px #3cf55;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .game-item:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 0 26px #5ff;
  }

  .game-thumb {
    width: 100%;
    height: 130px;
    border-radius: 10px;
    object-fit: cover;
    margin-bottom: 8px;
    box-shadow: 0 0 12px #3cf;
  }

  .game-name {
    font-size: 20px;
    font-weight: bold;
  }

  /* Loading intro */
  #loadingOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 999;
  }

  .loading-bar {
    width: 60%;
    height: 12px;
    background: #003;
    border-radius: 999px;
    overflow: hidden;
    box-shadow: 0 0 12px #0ff;
    margin-top: 20px;
  }

  .loading-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #0ff, #3cf);
    transition: width 0.6s linear;
  }

  .percent {
    margin-top: 10px;
    font-size: 22px;
    color: #7df;
    text-shadow: 0 0 15px #3cf, 0 0 25px #0ff;
  }

  .made-by {
    font-size: 22px;
    margin-top: 10px;
    color: #7df;
    text-shadow: 0 0 15px #3cf, 0 0 25px #0ff;
  }

  .cutscene {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
    text-align: center;
  }

  .cutscene-text {
    font-size: 22px;
    opacity: 0;
    color: #9df;
    text-shadow: 0 0 15px #3cf, 0 0 25px #0ff;
    animation: cutsceneFade 0.8s forwards;
  }

  .cutscene-text:nth-child(1) { animation-delay: 0.3s; }
  .cutscene-text:nth-child(2) { animation-delay: 0.9s; }
  .cutscene-text:nth-child(3) { animation-delay: 1.5s; }
  .cutscene-text:nth-child(4) { animation-delay: 2.1s; }

  @keyframes cutsceneFade {
    to { opacity: 1; }
  }
</style>
</head>
<body>

<audio id="startupSound" preload="auto">
  <source src="https://upload.wikimedia.org/wikipedia/commons/transcoded/4/4e/Windows_95_startup.ogg/Windows_95_startup.ogg.mp3" type="audio/mpeg">
</audio>

<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<div id="loadingOverlay">
  <div class="cutscene">
    <div class="cutscene-text">Initializing Galaxy Systems...</div>
    <div class="cutscene-text">Calibrating Starfield...</div>
    <div class="cutscene-text">Preparing Game Universe...</div>
    <div class="cutscene-text">Welcome, Logan.</div>
  </div>

  <div class="made-by">Made by Logan</div>

  <div class="loading-bar">
    <div class="loading-fill" id="loadingFill"></div>
  </div>

  <div class="percent" id="percentText">0%</div>
</div>

<h1>Galaxy Game Launcher</h1>

<input id="search" type="text" placeholder="Search numbers or names...">

<div class="game-list" id="gameList"></div>

<script>
document.getElementById("startupSound").play();

const fallbackImg =
  "https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=800&q=80";

/* Find cover image */
async function findCover(base) {
  const folder = `https://raw.githubusercontent.com/Lego611091/assets/main/${base}/`;
  const possible = ["cover.png", "cover.jpg", "icon.png", "icon.jpg"];

  for (const file of possible) {
    try {
      const res = await fetch(folder + file);
      if (res.ok) return folder + file;
    } catch {}
  }
  return fallbackImg;
}

/* Auto-detect name from inside HTML file */
async function getNameFromHTML(filename, fallback) {
  try {
    const res = await fetch(filename);
    if (!res.ok) return fallback;
    const html = await res.text();

    let match = html.match(/<title[^>]*>([^<]+)<\/title>/i);
    if (match && match[1].trim()) return match[1].trim();

    match = html.match(/<h1[^>]*>([^<]+)<\/h1>/i);
    if (match && match[1].trim()) return match[1].trim();

    return fallback;
  } catch {
    return fallback;
  }
}

/* Load games */
async function loadGames() {
  const res = await fetch("https://api.github.com/repos/Lego611091/html/contents");
  const files = await res.json();
  const htmlFiles = files.filter(f => f.name.endsWith(".html"));
  const gameList = document.getElementById("gameList");

  const cards = [];

  for (const f of htmlFiles) {
    const base = f.name.replace(".html", "");
    const cover = await findCover(base);
    const autoName = await getNameFromHTML(f.name, base);
    const label = autoName !== base ? `${base} – ${autoName}` : base;

    const card = document.createElement("div");
    card.className = "game-item";
    card.onclick = () => { window.location.href = f.name; };

    const img = document.createElement("img");
    img.className = "game-thumb";
    img.src = cover;
    img.onerror = () => { img.src = fallbackImg; };

    const title = document.createElement("div");
    title.className = "game-name";
    title.textContent = label;

    card.appendChild(img);
    card.appendChild(title);
    cards.push(card);
  }

  cards.forEach(card => gameList.appendChild(card));
}

/* 1-minute loading bar + percent counter */
async function startLoading() {
  const bar = document.getElementById("loadingFill");
  const percentText = document.getElementById("percentText");

  const totalTime = 60000; // 1 minute
  const interval = totalTime / 100; // 100 updates

  let percent = 0;

  const timer = setInterval(() => {
    percent += 1;
    bar.style.width = percent + "%";
    percentText.textContent = percent + "%";

    if (percent >= 100) {
      clearInterval(timer);
      finishLoading();
    }
  }, interval);

  await loadGames();
}

function finishLoading() {
  document.getElementById("loadingOverlay").style.display = "none";
  document.getElementById("gameList").style.opacity = "1";
}

startLoading();

/* Search */
document.getElementById("search").addEventListener("input", function() {
  const term = this.value.toLowerCase();
  document.querySelectorAll(".game-item").forEach(item => {
    const text = item.textContent.toLowerCase();
    item.style.display = text.includes(term) ? "" : "none";
  });
});
</script>

</body>
</html>
